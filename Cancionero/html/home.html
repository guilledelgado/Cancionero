<!DOCTYPE html>
    <html lang="es">
        <head>
            <title>Cancionero - Acordes para guitarra</title>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <link rel="stylesheet" href="/css/style.css"/>
            <link rel="icon" href="/multimedia/cancionero-logo-negro.png" type="image/png"/>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
            <script src="/js/vistas.js" defer></script>
            <script src="/js/perfil-artista.js" defer></script>
        </head>
        <body>
            <header></header>
            <div class="pagina">
                <img src="/multimedia/cancionero-logo-dorado.png" alt="Logo del Cancionero">
                <h1>Aprende y toca tus canciones favoritas</h1>
                <input type="search" id="buscador" placeholder="Buscar artista o canción">
                <section class="banner-carrusel">
                    <!-- El enlace cambia su href dinámicamente con JS -->
                    <a id="carrusel-link" href="/artistas.html">
                        <img id="carrusel-img" src="/multimedia/banner1.jpg" alt="Destacado">
                    </a>
                        <!-- Botones opcionales de navegación -->
                        <button id="btn-prev" class="carrusel-btn">&lt;</button>
                        <button id="btn-next" class="carrusel-btn">&gt;</button>
                </section>
            </div>
            <footer> </footer>
        </body>
    </html>
